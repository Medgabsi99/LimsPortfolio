<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141728"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#252a42" stroke-width="1.5"/>

  <!-- Flask Outline & Liquid -->
  <g filter="url(#glow)">
    <!-- Liquid fill inside flask -->
    <path d="M26 27 L38 27 L48 48 C49.5 51 47 54 43.5 54 L20.5 54 C17 54 14.5 51 16 48 Z" fill="url(#liquid)" opacity="0.9"/>
    
    <!-- Bubbles -->
    <circle cx="28" cy="46" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="36" cy="41" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="25" cy="38" r="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="33" cy="49" r="1.2" fill="#ffffff" opacity="0.5"/>

    <!-- Glass Flask Rim and Neck -->
    <path d="M26 12 L38 12 M28 12 L28 26 L16 48 C14.5 51 17 54 20.5 54 L43.5 54 C47 54 49.5 51 48 48 L36 26 L36 12" 
          fill="none" stroke="url(#glass)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Glass Highlight Reflection -->
    <path d="M20 49 L28 34 L28 20" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
